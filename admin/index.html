    <script>
      // Logo marquee: one mount function, re-run whenever the SPA re-renders or the route changes.
      (function () {
        const LOGOS = [
          { file: 'Pharmeasy-1.png', alt: 'PharmEasy', url: 'https://pharmeasy.in' },
          { file: 'gmr-group-logo-png_seeklogo-310947.png', alt: 'GMR Group', url: 'https://www.gmrgroup.in' },
          { file: 'cropped-logo-chola.png', alt: 'Chola MS', url: 'https://www.cholainsurance.com' },
          { file: 'Hyundai_Motor_Company_logo.svg.png', alt: 'Hyundai', url: 'https://www.hyundai.com/in' },
          { file: 'SCHIEBEL.png', alt: 'Schiebel', url: 'https://schiebel.net' },
          { file: 'Mufin-Green-Logo-For-Website-01-01.png', alt: 'Mufin', url: 'https://mufingreenfinance.com' },
          { file: 'Bennett-University-logo1-.png', alt: 'Bennett University', url: 'https://www.bennett.edu.in' },
          { file: 'MAHE_Logo_transparentBG.png', alt: 'Manipal', url: 'https://manipal.edu' },
          { file: 'tulip_logo_ng-removebg-preview.png', alt: 'Tulip', url: 'https://www.tulipcompression.com' },
          { file: 'GYP_drive_logos_3_page-0001-removebg-preview.png', alt: 'GypDrive', url: 'https://gypdrivefasteners.com' },
          { file: 'larsen-toubro.png', alt: 'Larsen & Toubro', url: 'https://www.larsentoubro.com' },
          { file: 'chandigarh-university.png', alt: 'Chandigarh University', url: 'https://www.cuchd.in' },
          { file: 'eid-parry.jpg', alt: 'EID Parry', url: 'https://eidparry.com' },
          { file: 'aditya-birla.jpg', alt: 'Aditya Birla Group', url: 'https://www.adityabirla.com' },
          { file: 'navyug-defence.png', alt: 'Navyug Defence', url: 'https://navyugdefence.ai' },
          { file: 'mwts.png', alt: 'Murugappa Water Technology Solutions', url: 'https://murugappawater.com' },
          { file: 'tvs-supply-chain.png', alt: 'TVS Supply Chain Solutions', url: 'https://www.tvsscs.com' }
        ];

        function tile(l) {
          var img = '<img src="/assets/logos/' + l.file + '" alt="' + l.alt + '" width="120" height="60" loading="eager" />';
          return l.url
            ? '<a class="evogr-logo-tile" href="' + l.url + '" target="_blank" rel="noopener noreferrer" aria-label="' + l.alt + '">' + img + '</a>'
            : '<div class="evogr-logo-tile">' + img + '</div>';
        }

        var TRACK_HTML = '<div class="evogr-logo-track">' +
          LOGOS.map(tile).join('') + LOGOS.map(tile).join('') + '</div>';

        // The marquee belongs directly after the hero (#home), on the home page only.
        function sync() {
          var hero = document.querySelector('#home');
          var existing = document.querySelector('.evogr-logo-carousel');

          if (!hero) {
            if (existing) existing.remove();
            return;
          }
          if (existing && existing.previousElementSibling === hero) return;
          if (existing) existing.remove();

          var carousel = document.createElement('div');
          carousel.className = 'evogr-logo-carousel';
          carousel.setAttribute('data-carousel-mounted', 'true');
          carousel.innerHTML = TRACK_HTML;
          hero.parentNode.insertBefore(carousel, hero.nextSibling);
          document.body.classList.add('page-loaded');
        }

        // Coalesce bursts of DOM mutations into one check per frame.
        var queued = false;
        function schedule() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(function () { queued = false; sync(); });
        }

        new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('popstate', schedule);
        ['pushState', 'replaceState'].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); schedule(); return r; };
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', schedule);
        } else {
          schedule();
        }
        window.addEventListener('load', schedule);

        // Reveal the page (body starts transparent to hide the pre-render flash) on every route,
        // as soon as React has rendered, with a hard fallback so it can never stay blank.
        function reveal() { if (document.body) document.body.classList.add('page-loaded'); }
        var root = document.getElementById('root');
        if (root && root.childElementCount) reveal();
        else if (root) {
          var ro = new MutationObserver(function () { if (root.childElementCount) { reveal(); ro.disconnect(); } });
          ro.observe(root, { childList: true });
        }
        setTimeout(reveal, 1500);
      })();
    </script>
  <script>
      // Web3Forms: forward the Contact form (/contact) submission to email. The React form
      // keeps saving to Supabase as before; this runs alongside it.
      (function () {
        var ACCESS_KEY = '85a73c7c-6ac9-4374-b9c9-d42bf807b09c'; // public Web3Forms key
        var seen = 0;

        function labelFor(el) {
          var id = el.id, text = '';
          if (id) {
            var lab = document.querySelector('label[for="' + id + '"]');
            if (lab) text = lab.textContent;
          }
          text = (text || el.getAttribute('placeholder') || el.name || id || 'Field').replace(/\*/g, '').trim();
          return text;
        }

        document.addEventListener('submit', function (e) {
          try {
            var form = e.target;
            if (!form || form.tagName !== 'FORM' || !form.querySelector('#contact-name')) return; // contact form only

            var fields = {};
            form.querySelectorAll('input, textarea, select').forEach(function (el) {
              if (el.type === 'hidden' || el.type === 'submit' || el.type === 'button') return;
              if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return;
              var v = (el.value || '').trim();
              if (v) fields[labelFor(el)] = v;
            });
            if (!Object.keys(fields).length) return;

            var heading = form.querySelector('h2, h3');
            var formName = (heading && heading.textContent.trim()) || document.title;

            var payload = Object.assign({
              access_key: ACCESS_KEY,
              subject: 'New website submission: ' + formName,
              from_name: 'Evogr Website',
              form: formName,
              page: location.href
            }, fields);

            fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(payload),
              keepalive: true
            }).catch(function () {});
          } catch (err) { /* never break the site's own form handling */ }
        }, true);
      })();
    </script>
