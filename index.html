          const logoHtml = (l) => {
            const img = `<img src="/assets/logos/${l.file}" alt="${l.alt}" width="120" height="60" loading="eager" />`;
            return l.url

              : `<div class="evogr-logo-tile">${img}</div>`;
          };
          const carousel = document.createElement('div');
          carousel.className = 'evogr-logo-carousel';
          carousel.setAttribute('data-carousel-mounted', 'true');
          carousel.innerHTML = `
            <div class="evogr-logo-track">
              ${logos.map(logoHtml).join('')}
              ${logos.map(logoHtml).join('')}
            </div>
          `;

          // Insert after hero section
          if (heroSection.nextSibling) {
            heroSection.parentNode.insertBefore(carousel, heroSection.nextSibling);
          } else {
            heroSection.parentNode.appendChild(carousel);
          }

          carouselAdded = true;
          document.body.classList.add('page-loaded');
        }

        // Start immediately
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', addCarousel);
        } else {
          addCarousel();

        // TASK 6: Also try after React renders with persistence check
        window.addEventListener('load', addCarousel);
        setTimeout(addCarousel, 100);
        setTimeout(addCarousel, 500);
        setTimeout(addCarousel, 1000);

            lastPath = window.location.pathname;
            if (lastPath === '/') {
              setTimeout(addCarousel, 50);
              setTimeout(addCarousel, 200);

        }, 100);
      })();

                  if (heroSection.nextSibling) {
                    heroSection.parentNode.insertBefore(newCarousel, heroSection.nextSibling);
                  } else {
                    heroSection.parentNode.appendChild(newCarousel);
                  }
                  document.body.classList.add('page-loaded');

  <script>
      // Web3Forms: forward the Contact form (/contact) submission to email. The React form
      // keeps saving to Supabase as before; this runs alongside it.
      (function () {
        var ACCESS_KEY = '85a73c7c-6ac9-4374-b9c9-d42bf807b09c'; // public Web3Forms key
        var seen = 0;

        function labelFor(el) {
          var id = el.id, text = '';
          if (id) {
            var lab = document.querySelector('label[for="' + id + '"]');
            if (lab) text = lab.textContent;
          }
          text = (text || el.getAttribute('placeholder') || el.name || id || 'Field').replace(/\*/g, '').trim();
          return text;
        }

        document.addEventListener('submit', function (e) {
          try {
            var form = e.target;
            if (!form || form.tagName !== 'FORM' || !form.querySelector('#contact-name')) return; // contact form only

            var fields = {};
            form.querySelectorAll('input, textarea, select').forEach(function (el) {
              if (el.type === 'hidden' || el.type === 'submit' || el.type === 'button') return;
              if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return;
              var v = (el.value || '').trim();
              if (v) fields[labelFor(el)] = v;
            });
            if (!Object.keys(fields).length) return;

            var heading = form.querySelector('h2, h3');
            var formName = (heading && heading.textContent.trim()) || document.title;

            var payload = Object.assign({
              access_key: ACCESS_KEY,
              subject: 'New website submission: ' + formName,
              from_name: 'Evogr Website',
              form: formName,
              page: location.href
            }, fields);

            fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(payload),
              keepalive: true
            }).catch(function () {});
          } catch (err) { /* never break the site's own form handling */ }
        }, true);
      })();
    </script>
